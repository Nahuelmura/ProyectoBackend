<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../lib/bootstrap/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-4">
        <h1 class="mb-4">Nuevo Pedido</h1>


        <div class="row mb-4">


         
            <div class="col-md-3">
                <label class="form-label">Nombre Cliente</label>
                <input type="text" class="form-control" id="nombre">
            </div>
            <div class="col-md-4">
                <label class="form-label">Fecha</label>
                <input type="date" class="form-control" id="fecha">
            </div>
            <div class="col-md-4">
                <label class="form-label">Estado</label>
                <select class="form-control" id="estado">
                    <option value="0">Pendiente</option>
                    <option value="1">Enviado</option>
                    <option value="2">Entregado</option>
                </select>
            </div>

        </div>


        <h3>Detalle del pedido</h3>
        <div class="row mb-3 align-items-end">
            <div class="col-md-4 mb-3 mb-md-0">
                <label class="form-label">Producto</label>
                <select class="form-control" id="producto" onchange="cargarPrecio()">
                    <option value="">[SELECCIONE...]</option>
                </select>
            </div>


            <div class="col-md-3 mb-3 mb-md-0">
                <label class="form-label">Cantidad</label>
                <input type="number" class="form-control" id="cantidad">
            </div>
            <div class="col-md-3 mb-3 mb-md-0">
                <label class="form-label">Precio Unitario</label>
                <input type="number" id="precioUnitario" step="0.01" readonly>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-primary w-100" onclick="AgregarDetalle()">
                    Agregar
                </button>
            </div>
        </div>

        <!-- DETALLES EN MEMORIA -->
        <div class="table-responsive">
            <table class="table table-striped table-hover text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Producto</th>
                        <th>Cliente</th>
                        <th>Cantidad</th>
                        <th>Precio Unitario</th>
                        <th>Subtotal</th>
                        <th>Eliminar</th>
                    </tr>
                </thead>
                <tbody id="tablaDetalles">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>

        <!-- BOTÓN CREAR -->
        <div class="text-end mb-5">
            <button type="button" class="btn btn-success" onclick="CrearPedido()">
                Crear Pedido
            </button>
            <div class="col-md-4">
                <label class="form-label">Total</label>
                <input type="number" class="form-control" id="total" readonly>
            </div>
        </div>

        <hr>

        <!-- PEDIDOS GUARDADOS -->
        <h2 class="mb-4 mt-4">Pedidos Anteriores</h2>
        <div class="table-responsive">
            <table class="table table-striped table-hover text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Nombre del cliente</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="TablaPedido">

                </tbody>
            </table>
        </div>
    </div>


    <script src="../js/Pedido.1.0.0.js"></script>
    <script src="../lib/bootstrap/js/bootstrap.min.js"></script>
    <script src="../js/layout.js"></script>
</body>

</html>
